<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meares Upcoming Birthdays</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#f6f7f9}
.screen{width:100vw;height:100vh;display:flex;flex-direction:column;color:#073f9f}
.header{height:24vh;min-height:150px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 10% 40%,#0871d1 0,rgba(8,113,209,.5) 8%,transparent 23%),radial-gradient(circle at 90% 35%,#dfbf00 0,rgba(223,191,0,.48) 8%,transparent 23%),#030a12}
.header img{max-height:88%;max-width:40%;object-fit:contain}
.stripe{height:14px;background:#ffe000;border-bottom:5px solid #073f9f}
.content{position:relative;flex:1;padding:2.2vh 7vw 1.2vh;background:radial-gradient(circle at 8% 20%,rgba(255,224,0,.18) 0 4px,transparent 5px),radial-gradient(circle at 92% 70%,rgba(7,63,159,.14) 0 4px,transparent 5px),#f7f8fa;background-size:130px 110px,150px 130px,auto}
.title{text-align:center;margin-bottom:1.5vh}
.eyebrow{font-size:1.15vw;letter-spacing:.55vw;font-weight:900;color:#555f6d}
h1{margin:.25vh 0 0;font-size:3.9vw;line-height:1;font-style:italic;font-weight:1000;color:#073f9f;text-shadow:3px 3px 0 #ffe000}
.list{width:min(86vw,1500px);margin:0 auto;display:flex;flex-direction:column;gap:1.05vh}
.row{height:8.2vh;min-height:58px;display:grid;grid-template-columns:26% 1fr;align-items:center;background:white;border:3px solid #e0b900;border-radius:18px;box-shadow:0 6px 16px rgba(0,0,0,.10);overflow:hidden}
.date{height:100%;display:flex;align-items:center;justify-content:center;background:#073f9f;color:#ffe000;font-size:1.75vw;font-weight:1000;letter-spacing:.08vw}
.name{padding:0 2vw;font-size:2.15vw;font-weight:1000;color:#073f9f;text-transform:uppercase}
.footer{height:6.3vh;display:flex;align-items:center;justify-content:center;background:#073f9f;border-top:9px solid #ffe000;color:white;font-size:1vw;font-weight:900;letter-spacing:.38vw}
.empty{text-align:center;font-size:2.2vw;font-weight:900;margin-top:8vh}
</style>
</head>
<body>
<main class="screen">
  <header class="header"><img src="./assets/meares-logo.png" alt="Meares Plumbing Electrical"></header>
  <div class="stripe"></div>
  <section class="content">
    <div class="title">
      <div class="eyebrow">LET'S CELEBRATE</div>
      <h1>UPCOMING BIRTHDAYS!</h1>
    </div>
    <div id="list" class="list"></div>
  </section>
  <footer class="footer">MEARES PLUMBING &amp; ELECTRICAL</footer>
</main>
<script>
function prettyDate(value){
  const s=String(value||'').trim();
  if(!s) return '';
  return s.toUpperCase();
}
async function load(){
  const list=document.getElementById('list');
  try{
    const r=await fetch('./upcoming-birthdays.json?ts='+Date.now(),{cache:'no-store'});
    const data=await r.json();
    const people=Array.isArray(data.birthdays)?data.birthdays.slice(0,5):[];
    if(!people.length){
      list.innerHTML='<div class="empty">NO UPCOMING BIRTHDAYS TO DISPLAY</div>';
      return;
    }
    list.innerHTML=people.map(p=>`
      <div class="row">
        <div class="date">${prettyDate(p.date)}</div>
        <div class="name">${String(p.name||'').trim()}</div>
      </div>`).join('');
  }catch(e){
    list.innerHTML='<div class="empty">UPCOMING BIRTHDAYS</div>';
  }
}
load();
</script>
</body>
</html>
